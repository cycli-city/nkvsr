name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (prettier · eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    name: API contract (generated TypeScript types are in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: python -m app.cli export-openapi --out ../frontend/openapi.json
        working-directory: backend
      - run: npm run gen:api
        working-directory: frontend
      - name: Fail if the committed OpenAPI document or generated types are stale
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts \
            || (echo "::error::Run 'make openapi' and commit the result." && exit 1)

  e2e:
    name: End-to-end + accessibility (Playwright, synthetic dev data)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker images + Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack on SYNTHETIC data (CI has no Elexon access guarantee)
        run: docker compose -f docker-compose.yml -f docker-compose.synthetic.yml up -d --build --wait --wait-timeout 180
      - name: API is healthy and serving data through the nginx proxy
        run: |
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep '"data_loaded":true'
          curl -fsS "http://localhost:8080/api/summary" | grep '"is_synthetic":true'
      - name: SPA shell and deep links are served
        run: |
          curl -fsS http://localhost:8080/ | grep -i "WindScope"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/intervals | grep 200
      - name: Security headers are present
        run: |
          curl -fsSI http://localhost:8080/ | grep -i "x-content-type-options: nosniff"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
